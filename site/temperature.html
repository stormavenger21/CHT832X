<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CHT832x Temperature</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            color: var(--text-color, #222);
            background: var(--background-color, #fff);
        }

        .sensor-card {
            max-width: 360px;
            margin: auto;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #8886;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        .temperature {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0 8px;
        }

        .humidity {
            font-size: 1.2rem;
        }

        .status {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .error {
            color: #d9534f;
        }

        .timestamp {
            margin-top: 8px;
            font-size: 0.8rem;
            opacity: 0.75;
        }
    </style>
</head>

<body>
    <div class="sensor-card">
        <h2>CHT832x Sensor</h2>

        <div class="temperature" id="temperature">--.- °C</div>

        <div class="humidity">
            Humidity: <span id="humidity">--.- %</span>
        </div>

        <div class="status" id="status">
            Connecting to sensor...
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        const temperatureElement = document.getElementById("temperature");
        const humidityElement = document.getElementById("humidity");
        const statusElement = document.getElementById("status");
        const timestampElement = document.getElementById("timestamp");

        async function updateSensor() {
            try {
                // Relative URL keeps the request under the extension's base path.
                const response = await fetch("api/temperature", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }

                const data = await response.json();

                if (!data.sensor_ok) {
                    temperatureElement.textContent = "--.- °C";
                    humidityElement.textContent = "--.- %";
                    statusElement.textContent =
                        "Sensor unavailable: " + (data.error || "Unknown error");
                    statusElement.className = "status error";
                } else {
                    temperatureElement.textContent =
                        `${data.temperature_c.toFixed(2)} °C`;

                    humidityElement.textContent =
                        `${data.humidity_rh.toFixed(2)} %`;

                    statusElement.textContent = "Sensor OK";
                    statusElement.className = "status";
                }

                timestampElement.textContent = data.updated_at
                    ? `Last reading: ${new Date(data.updated_at).toLocaleTimeString()}`
                    : "";

            } catch (error) {
                temperatureElement.textContent = "--.- °C";
                humidityElement.textContent = "--.- %";
                statusElement.textContent = "Connection error: " + error.message;
                statusElement.className = "status error";
                timestampElement.textContent = "";
            }
        }

        updateSensor();
        setInterval(updateSensor, 1000);
    </script>
</body>
</html>
